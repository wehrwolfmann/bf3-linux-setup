[package]
name = "bf3-linux-setup"
version = "1.0.0"
edition = "2021"
authors = ["Wehrwolfmann"]
description = "Set up Battlefield 3 (Steam/Proton) for Battlelog on Linux: Firefox OS spoof + PunkBuster refresh."
license = "MIT"

[[bin]]
name = "bf3-linux-setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ureq = { version = "2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
